<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-copilot</title>
<style>
  :root { --bg:#0f1216; --card:#171b21; --fg:#e6e9ee; --mut:#8b95a3; --acc:#4f9cf9; --line:#262c35; --warn:#e0a13a; --ok:#4caf7d; }
  * { box-sizing:border-box; } body { margin:0; font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; }
  h1 { font-size:16px; margin:0; } .mut { color:var(--mut); }
  main { padding:20px; max-width:1280px; margin:0 auto; }
  .cards { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-width:92px; }
  .card b { display:block; font-size:20px; } .card span { color:var(--mut); font-size:12px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; align-items:center; }
  select, input, button, textarea { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.03em; }
  tr:last-child td { border-bottom:0; }
  tbody tr { cursor:pointer; } tbody tr:hover { background:#1c222b; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--mut); }
  .dup { color:var(--warn); border-color:var(--warn); }
  .chip { display:inline-block; font-size:11px; padding:1px 6px; border-radius:5px; margin:0 2px 2px 0; border:1px solid var(--line); color:var(--mut); }
  .chip.on { color:var(--ok); border-color:var(--ok); }
  .score { font-variant-numeric:tabular-nums; }
  a { color:var(--acc); text-decoration:none; }
  /* detail drawer */
  #drawer { position:fixed; top:0; right:0; height:100%; width:min(680px,92vw); background:var(--bg); border-left:1px solid var(--line); box-shadow:-20px 0 40px #0008; transform:translateX(100%); transition:transform .18s ease; overflow:auto; padding:18px 20px; }
  #drawer.open { transform:none; }
  #drawer h2 { margin:0 0 2px; font-size:18px; } #drawer h3 { font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--acc); border-bottom:1px solid var(--line); padding-bottom:3px; margin:18px 0 6px; }
  #drawer .close { position:absolute; top:14px; right:16px; }
  pre { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; white-space:pre-wrap; word-break:break-word; font-size:12.5px; max-height:320px; overflow:auto; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:4px 0; }
  .kv { color:var(--mut); min-width:110px; display:inline-block; }
</style>
</head>
<body>
<header>
  <h1>job-copilot</h1>
  <span class="mut" id="sub">local · DB là nguồn state</span>
</header>
<main>
  <div class="cards" id="funnel"></div>
  <div class="bar">
    <select id="f-status"><option value="">status: all</option></select>
    <select id="f-source"><option value="">source: all</option></select>
    <select id="f-seniority"><option value="">seniority: all</option></select>
    <button id="refresh">refresh</button>
    <span class="mut" id="due"></span>
  </div>
  <table>
    <thead><tr>
      <th>Company / title</th><th>Source</th><th>Seniority</th><th>Score</th>
      <th>Stage</th><th>Status</th><th>Follow-up</th><th>Next action</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<div id="drawer">
  <button class="close" id="drawer-close">✕</button>
  <div id="drawer-body"></div>
</div>

<script>
const STATUSES = ["saved","applied","screen","tech","onsite","offer","rejected","ghosted","closed"];
const STAGES = ["scanned","scored","cv","prep","applied"];
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const addDays = (iso,n)=>{const d=new Date(iso);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const today = () => new Date().toISOString().slice(0,10);

function opts(sel, values) { for (const v of values){const o=document.createElement("option");o.value=v;o.textContent=v;sel.append(o);} }
async function api(path, body){
  const r = await fetch(path, body ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)} : {});
  return r.json();
}
const stageChips = st => STAGES.map(s => `<span class="chip ${st.includes(s)?"on":""}">${s}</span>`).join("");

async function load() {
  const q = new URLSearchParams();
  for (const k of ["status","source","seniority"]) { const v=$("#f-"+k).value; if(v) q.set(k,v); }
  const [rep, jobs] = await Promise.all([api("/api/report"), api("/api/jobs?"+q)]);
  $("#funnel").innerHTML = STATUSES.map(s => `<div class="card"><b>${rep.funnel[s]||0}</b><span>${s}</span></div>`).join("");
  const due = rep.followup_due||[];
  $("#due").textContent = due.length ? `⚠ ${due.length} follow-up due: ${due.map(d=>d.id.slice(-24)).join(", ")}` : "";
  $("#rows").innerHTML = jobs.map(j => `
    <tr data-id="${esc(j.id)}">
      <td><b>${esc(j.company)}</b><div class="mut">${esc(j.title)}</div>
          ${j.duplicate_of ? `<span class="tag dup">dup of ${esc(j.duplicate_of.slice(-24))}</span>` : ""}</td>
      <td><span class="tag">${esc(j.source)}</span></td>
      <td>${esc(j.seniority)}</td>
      <td class="score">${j.match_score ?? ""}</td>
      <td>${stageChips(j.stage||[])}</td>
      <td><select data-act="status" data-id="${esc(j.id)}">
        ${STATUSES.map(s=>`<option ${s===j.status?"selected":""}>${s}</option>`).join("")}
      </select></td>
      <td>${esc(j.followup_at)}</td>
      <td class="mut">${esc(j.next_action)}</td>
    </tr>`).join("");
}

async function openDetail(id) {
  const d = await api(`/api/jobs/${encodeURIComponent(id)}`);
  if (d.error) return;
  const gap = JSON.parse(d.gap_skills_json || "[]");
  $("#drawer-body").innerHTML = `
    <h2>${esc(d.company)}</h2>
    <div class="mut">${esc(d.title)}</div>
    <div class="row">${stageChips(d.stage||[])} <span class="tag">${esc(d.status)}</span></div>
    <div class="row"><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.url)||"(no url)"} ↗</a></div>
    <h3>Score</h3>
    <div><b class="score">${d.match_score ?? ""}</b> ${esc(d.score_rationale)}</div>
    ${gap.length ? `<div class="row">gap: ${gap.map(g=>`<span class="chip">${esc(g)}</span>`).join("")}</div>` : ""}
    ${d.notes ? `<div class="row"><span class="kv">notes</span>${esc(d.notes)}</div>` : ""}
    <div class="row"><span class="kv">location</span>${esc(d.location)} · ${esc(d.remote)}</div>
    <div class="row"><span class="kv">applied</span>${esc(d.applied_at)} ${d.apply_method?`(${esc(d.apply_method)})`:""}</div>
    <h3>CV (${d.cvs.length})</h3>
    ${d.cvs.length ? d.cvs.map(c=>`<div class="row"><button data-cv="${esc(d.id)}">view</button> ${esc(c.path)} <span class="mut">${c.is_current?"current":""}</span></div>`).join("")
      : `<div class="mut">no CV yet</div>`}
    ${d.prep_path ? `<h3>Prep</h3><div>${esc(d.prep_path)}</div>` : ""}
    <h3>Interview Prep</h3>
    ${prepBlock(d)}
    <h3>Raw JD</h3>
    <pre>${esc(d.raw_jd) || "(missing)"}</pre>
    <div id="cv-view"></div>
    <div id="prep-view"></div>`;
  $("#drawer").classList.add("open");
}

const PREP_STATUSES = ["draft","ready","done"];
function prepBlock(d) {
  const p = d.prep;
  if (!p && !d.prep_path) return `<div class="mut">no prep yet</div>`;
  const st = p ? p.prep_status : "draft";
  const rounds = p ? (p.rounds || []) : [];
  return `
    <div class="row">
      <span class="kv">status</span>
      <select data-act="prep" data-id="${esc(d.id)}">
        ${PREP_STATUSES.map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}
      </select>
      ${d.prep_path ? `<button data-prep="${esc(d.id)}">view cue card</button>` : `<span class="mut">no cue card file</span>`}
    </div>
    ${p ? `<div class="row"><span class="kv">rounds</span>${rounds.length} logged</div>
      ${rounds.map(r=>`<div class="row mut">${esc(r.at)} · ${esc(r.round_type)} — ${esc(r.went_well||r.notes||"")}</div>`).join("")}` : ""}
    <div class="row">
      <input id="pr-type" placeholder="round (mock/tech)" style="width:130px">
      <input id="pr-fix" placeholder="what to fix" style="flex:1">
      <button data-prepround="${esc(d.id)}">+ round</button>
    </div>`;
}

async function openPrep(id) {
  const c = await api(`/api/prep/${encodeURIComponent(id)}`);
  $("#prep-view").innerHTML = c.markdown
    ? `<h3>Cue card · ${esc(c.path)}</h3><pre>${esc(c.markdown)}</pre>`
    : `<h3>Cue card</h3><div class="mut">${esc(c.error||"not found")}</div>`;
  $("#prep-view").scrollIntoView({behavior:"smooth"});
}

async function openCv(id) {
  const c = await api(`/api/cv/${encodeURIComponent(id)}`);
  $("#cv-view").innerHTML = c.markdown
    ? `<h3>CV · ${esc(c.path)}</h3><pre>${esc(c.markdown)}</pre>`
    : `<h3>CV</h3><div class="mut">${esc(c.error||"not found")}</div>`;
  $("#cv-view").scrollIntoView({behavior:"smooth"});
}

document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.act === "status") {
    const id = t.dataset.id, to = t.value, body = { to };
    if (to === "applied") { body.applied_at = today(); body.followup_at = addDays(today(),7); }
    await api(`/api/jobs/${encodeURIComponent(id)}/status`, body);
    return load();
  }
  if (t.dataset.act === "prep") {
    await api(`/api/jobs/${encodeURIComponent(t.dataset.id)}/prep`, { to: t.value });
    return openDetail(t.dataset.id);
  }
});
document.addEventListener("click", async e => {
  const cvBtn = e.target.closest("[data-cv]");
  if (cvBtn) { e.stopPropagation(); return openCv(cvBtn.dataset.cv); }
  const prepBtn = e.target.closest("[data-prep]");
  if (prepBtn) { e.stopPropagation(); return openPrep(prepBtn.dataset.prep); }
  const roundBtn = e.target.closest("[data-prepround]");
  if (roundBtn) {
    e.stopPropagation();
    const id = roundBtn.dataset.prepround;
    await api(`/api/jobs/${encodeURIComponent(id)}/prep-round`,
      { type: $("#pr-type").value || "mock", to_fix: $("#pr-fix").value });
    return openDetail(id);
  }
  if (e.target.id === "drawer" || e.target.id === "drawer-close") { $("#drawer").classList.remove("open"); return; }
  if (e.target.closest("#drawer")) return;  // clicks inside the drawer don't reopen
  const tr = e.target.closest("tbody tr");
  if (tr) openDetail(tr.dataset.id);
});
$("#refresh").onclick = load;
["status","source","seniority"].forEach(k => $(`#f-${k}`).onchange = load);
opts($("#f-status"), STATUSES);
opts($("#f-source"), ["itviec","linkedin","topcv","vietnamworks","import","referral"]);
opts($("#f-seniority"), ["intern","fresher","junior","mid","senior","lead","manager"]);
load();
</script>
</body>
</html>
